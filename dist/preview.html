<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#bcd7e9">
  <meta name="description" content="Свадебное приглашение Бекзата и Алины">
  <base href="/">
  <title>Бекзат и Алина — свадебное приглашение</title>
  <link rel="preload" href="assets/fonts/cormorant-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cormorant-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/sky-continuous.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="styles.css?v=9">
  <style>
    html,
    body.preview-page {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .preview-page main,
    .preview-page .hero {
      height: 100svh;
      min-height: 100svh;
      overflow: hidden;
    }

    .preview-page .reveal {
      opacity: 1;
      transform: none;
      transition: none;
    }

    .preview-page .scroll-cue {
      pointer-events: none;
    }
  </style>
</head>
<body class="preview-page">
  <div class="sky-noise" aria-hidden="true"></div>

  <main>
    <section class="hero" aria-labelledby="heroNames">
      <div class="hero__mist hero__mist--one" aria-hidden="true"></div>
      <div class="hero__mist hero__mist--two" aria-hidden="true"></div>
      <div class="hero__content reveal">
        <p class="eyebrow">Свадебное приглашение</p>
        <div class="ornate-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h1 class="hero__names" id="heroNames">
          <span>Бекзат</span>
          <em>&amp;</em>
          <span>Алина</span>
        </h1>
        <div class="hero__date">12 июня 2027</div>
        <div class="scroll-cue" aria-hidden="true">
          <span>листайте вниз</span>
          <i></i>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
